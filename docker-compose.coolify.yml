services:
  migrate:
    build: .
    command: python manage.py migrate --noinput
    restart: "no"
    exclude_from_hc: true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: python manage.py run_studio_worker
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: brightbean
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brightbean"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  media_data: